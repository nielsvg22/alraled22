version: '3.8'

services:
  # ─── MySQL Database ───────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-alraled_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-alraled}
      MYSQL_USER: ${MYSQL_USER:-alraled}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-alraled_secret}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: mysql://${MYSQL_USER:-alraled}:${MYSQL_PASSWORD:-alraled_secret}@db:3306/${MYSQL_DATABASE:-alraled}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      UPLOADS_DIR: /data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@alraled.nl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      NODE_ENV: production
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "5000:5000"

  # ─── Storefront (aldraled) ────────────────────────────────────
  storefront:
    build:
      context: ./aldraled
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${STOREFRONT_API_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "3000:80"

  # ─── CRM Admin Frontend ───────────────────────────────────────
  crm:
    build:
      context: ./crm-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${CRM_API_URL:-http://localhost:5000}
        VITE_API_BASE: /api
        VITE_BASE_PATH: /
    restart: unless-stopped
    ports:
      - "3001:80"

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
