server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Oude WordPress-adressen: permanente doorverwijzing (SEO)
    rewrite ^/webshop/?$ /producten permanent;
    rewrite ^/winkelwagen/?$ /checkout permanent;
    rewrite ^/afrekenen/?$ /checkout permanent;
    rewrite ^/mijn-account/?$ /account permanent;
    rewrite ^/automotive/?$ /bedrijfswagenverlichting permanent;
    rewrite ^/led-hefbrugverlichting/?$ /hefbrugverlichting permanent;
    rewrite ^/led-bouwlichtslangen/?$ /lichtslangen permanent;
    rewrite ^/technische-groothandels/?$ /groothandels permanent;
    rewrite ^/alra-led/?$ /over-ons permanent;
    rewrite ^/terugbetaalde-retourneringen/?$ /retourbeleid permanent;
    rewrite ^/klachten-en-retouren/?$ /klachten permanent;

    # index.html mag nooit uit de browsercache komen: na een deploy moet direct de nieuwe versie laden
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
