# Eenmalige cache-reset per bezoeker: wie nog een oude (WordPress-)versie van de site in de browsercache heeft,
# krijgt bij het eerste bezoek aan de nieuwe site een Clear-Site-Data-opdracht voor de HTTP-cache (niet voor cookies,
# winkelwagen of voorkeuren). Daarna zet een kleine functionele cookie de reset uit zodat dit niet herhaald wordt.
map $cookie_alra_site $alra_clear_cache {
    default "\"cache\"";
    "v2"    "";
}
map $cookie_alra_site $alra_set_cookie {
    default "alra_site=v2; Max-Age=31536000; Path=/; Secure; SameSite=Lax";
    "v2"    "";
}


# ── SEO in de eerste HTML (ook zonder JavaScript) ──
# Per adres een eigen titel, omschrijving en canonical in index.html. De teksten komen uit src/lib/seoPages.js (Nederlands);
# pas je ze daar aan, pas ze dan ook hier aan. Product-, blog- en overige pagina's krijgen de algemene tekst en hun eigen canonical;
# hun specifieke titel zet de pagina zelf zodra de inhoud geladen is.
map $request_uri $seo_path {
    default "";
    ~^(?<p>[^?#]*?)/*(?:\?.*)?$ $p;
}
map $seo_path $seo_title {
    default "ALRA LED Solutions | Professionele LED-verlichting";
    "" "ALRA LED Solutions | Professionele LED-verlichting";
    /over-ons "Over ons | ALRA LED Solutions";
    /producten "LED-verlichting kopen in de webshop | ALRA LED Solutions";
    /contact "Contact | ALRA LED Solutions";
    /blog "Blog over LED-verlichting | ALRA LED Solutions";
    /groothandels "Voor groothandels en partners | ALRA LED Solutions";
    /verkooppunten "Verkooppunten en vestigingen | ALRA LED Solutions";
    /retourbeleid "Retourbeleid en garantie | ALRA LED Solutions";
    /algemene-voorwaarden "Algemene voorwaarden | ALRA LED Solutions";
    /privacy-policy "Privacybeleid | ALRA LED Solutions";
    /klachten "Klachten en retouren | ALRA LED Solutions";
    /retouren "Retour aanmelden | ALRA LED Solutions";
}
map $seo_path $seo_desc {
    default "Professionele LED-verlichting voor bedrijfswagens, bouwplaatsen en werkplaatsen. Bedrijfswagenverlichting, bouwlichtslangen en hefbrugverlichting, direct uit voorraad leverbaar.";
    "" "Professionele LED-verlichting voor bedrijfswagens, bouwplaatsen en werkplaatsen. Bedrijfswagenverlichting, bouwlichtslangen en hefbrugverlichting, direct uit voorraad leverbaar.";
    /over-ons "Maak kennis met ALRA LED Solutions: specialist in LED-verlichting voor bedrijfswagens, bouw en werkplaats. Gecertificeerde producten, eigen voorraad en persoonlijk advies.";
    /producten "Bestel professionele LED-verlichting online: werklampen, bouwlichtslangen, bedrijfswagenverlichting en hefbrugverlichting. Gratis verzending boven €250.";
    /contact "Neem contact op met ALRA LED Solutions in Apeldoorn voor advies, een offerte of vragen over uw bestelling. Bel 085 0021 606 of stuur een bericht.";
    /blog "Tips, uitleg en keuzehulp over LED-werkverlichting, bedrijfswagenverlichting en bouwverlichting van de specialisten van ALRA LED Solutions.";
    /groothandels "ALRA LED levert gecertificeerde LED-verlichting aan groothandels en distributeurs in Nederland en België. Scherpe condities, eigen voorraad en persoonlijk advies.";
    /verkooppunten "Vind een verkooppunt van ALRA LED bij u in de buurt: vestigingen van onze groothandelspartners in Nederland.";
    /retourbeleid "14 dagen bedenktijd, een jaar verkopersgarantie en de wettelijke rechten van consumenten. Zo retourneert u een bestelling bij ALRA LED Solutions.";
    /algemene-voorwaarden "De algemene voorwaarden van ALRA LED Solutions voor bestellingen, levering, betaling en garantie.";
    /privacy-policy "Lees hoe ALRA LED Solutions omgaat met uw persoonsgegevens en cookies.";
    /klachten "Heeft u een klacht of wilt u iets retourneren? Zo neemt u contact op met ALRA LED Solutions en hoe wij uw melding afhandelen.";
    /retouren "Meld een retour of garantieclaim aan bij ALRA LED Solutions.";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Oude WordPress-adressen: permanente doorverwijzing (SEO)
    rewrite ^/webshop/?$ /producten permanent;
    rewrite ^/winkelwagen/?$ /checkout permanent;
    rewrite ^/afrekenen/?$ /checkout permanent;
    rewrite ^/mijn-account/?$ /account permanent;
    rewrite ^/automotive/?$ /bedrijfswagenverlichting permanent;
    rewrite ^/led-hefbrugverlichting/?$ /hefbrugverlichting permanent;
    rewrite ^/led-bouwlichtslangen/?$ /lichtslangen permanent;
    rewrite ^/technische-groothandels/?$ /groothandels permanent;
    rewrite ^/alra-led/?$ /over-ons permanent;
    rewrite ^/terugbetaalde-retourneringen/?$ /retourbeleid permanent;
    rewrite ^/klachten-en-retouren/?$ /klachten permanent;

    # index.html mag nooit uit de browsercache komen: na een deploy moet direct de nieuwe versie laden
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Clear-Site-Data $alra_clear_cache always;
        add_header Set-Cookie $alra_set_cookie always;
        # Eerste HTML aanpassen (de patronen moeten exact overeenkomen met de gebouwde index.html; bij een wijziging daar ook hier aanpassen)
        sub_filter_once on;
        sub_filter '<title>ALRA LED Solutions - Professionele LED Verlichting</title>' '<title>$seo_title</title>';
        sub_filter '<link rel="canonical" href="https://alra-led.com"/>' '<link rel="canonical" href="https://$host$seo_path"/>';
        sub_filter '<meta name="description" content="ALRA LED Solutions - Professionele LED-verlichting voor bedrijfswagens, bouwplaatsen en werkplaatsen. Meer dan 10 jaar ervaring."/>' '<meta name="description" content="$seo_desc"/>';
        sub_filter '<meta property="og:title" content="ALRA LED Solutions - Professionele LED Verlichting"/>' '<meta property="og:title" content="$seo_title"/>';
        sub_filter '<meta property="og:description" content="Hoogwaardige LED-verlichting voor professionals. Bedrijfswagenverlichting, bouwlichtslangen, hefbrugverlichting en meer."/>' '<meta property="og:description" content="$seo_desc"/>';
        sub_filter '<meta name="twitter:title" content="ALRA LED Solutions - Professionele LED Verlichting"/>' '<meta name="twitter:title" content="$seo_title"/>';
        sub_filter '<meta name="twitter:description" content="Hoogwaardige LED-verlichting voor professionals."/>' '<meta name="twitter:description" content="$seo_desc"/>';
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
