# Eenmalige cache-reset per bezoeker: wie nog een oude (WordPress-)versie van de site in de browsercache heeft,
# krijgt bij het eerste bezoek aan de nieuwe site een Clear-Site-Data-opdracht voor de HTTP-cache (niet voor cookies,
# winkelwagen of voorkeuren). Daarna zet een kleine functionele cookie de reset uit zodat dit niet herhaald wordt.
map $cookie_alra_site $alra_clear_cache {
    default "\"cache\"";
    "v2"    "";
}
map $cookie_alra_site $alra_set_cookie {
    default "alra_site=v2; Max-Age=31536000; Path=/; Secure; SameSite=Lax";
    "v2"    "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Oude WordPress-adressen: permanente doorverwijzing (SEO)
    rewrite ^/webshop/?$ /producten permanent;
    rewrite ^/winkelwagen/?$ /checkout permanent;
    rewrite ^/afrekenen/?$ /checkout permanent;
    rewrite ^/mijn-account/?$ /account permanent;
    rewrite ^/automotive/?$ /bedrijfswagenverlichting permanent;
    rewrite ^/led-hefbrugverlichting/?$ /hefbrugverlichting permanent;
    rewrite ^/led-bouwlichtslangen/?$ /lichtslangen permanent;
    rewrite ^/technische-groothandels/?$ /groothandels permanent;
    rewrite ^/alra-led/?$ /over-ons permanent;
    rewrite ^/terugbetaalde-retourneringen/?$ /retourbeleid permanent;
    rewrite ^/klachten-en-retouren/?$ /klachten permanent;

    # index.html mag nooit uit de browsercache komen: na een deploy moet direct de nieuwe versie laden
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Clear-Site-Data $alra_clear_cache always;
        add_header Set-Cookie $alra_set_cookie always;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
